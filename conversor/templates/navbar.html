
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TC Sports</title>
</head>
<body class="bg-gray-100">
<nav class="bg-white border-gray-200">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="{{url_for('zonas')}}" class="flex items-center">
      <img src="{{ url_for('static', filename='image/logotc-navbar.png')}}" class="h-12 mr-3 " alt="Flowbite Logo" />
      
    </a>
    <button id="btNav" data-collapse-toggle="navbar-dropdown" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" aria-controls="navbar-dropdown" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
        </svg>
    </button>
    <div class="hidden w-full md:block md:w-auto" id="divNav">
      <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white md">



        <li class="relative">
          <button id="dropdownNavbarLink4" data-dropdown-toggle="dropdownNavbar" class="flex items-center justify-between w-full py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 md:w-auto ">Planejamento Nutricional <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
    </svg></button>
          <!-- Dropdown menu -->
          <div id="dropdownNavbar4" class="absolute top-full mt-2 z-50 hidden font-normal bg-white divide-y divide-gray-100 rounded-lg shadow w-44">
              <ul class="py-2 text-sm text-gray-700 " aria-labelledby="dropdownLargeButton">
                <li>
                  <a href="{{url_for('novo_suplemento')}}" class="block px-4 py-2 hover:bg-gray-100 ">Novo Suplemento</a>
                </li>
                <li>
                  <a href="{{url_for('listar_suplementos')}}" class="block px-4 py-2 hover:bg-gray-100 ">Lista de Suplementos</a>
                </li>
    
                <li>
                  <a href="{{url_for('planejamento')}}" class="block px-4 py-2 hover:bg-gray-100 ">Meu Planejamento</a>
                </li>
                <li>
                  <a href="{{url_for('resumo_view')}}" class="block px-4 py-2 hover:bg-gray-100 ">Resumo por Hora</a>
                </li>
              </ul>
          </div>
      </li>
    

      <li>
        <a href="{{ url_for('ferramentas_calculadora') }}"
       class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
        Ferramentas
        </a>
      </li>


        <li>
          <a href="{{ url_for('zonas') }}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0" aria-current="page">Zonas de Treino</a>
        </li>
        
        <li>
          <a href="{{ url_for('sobre') }}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0">Sobre</a>
        </li>

        {% if current_user.is_authenticated %}
        <li class="relative">
          <button id="userDropdown" class="flex items-center space-x-2 text-gray-700 ">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
          </button>
          <div id="dropdownUserMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded shadow z-50">
            <div class="px-4 py-2 text-sm text-gray-700">{{ current_user.nome}}</div>
            <div class="border-t"></div>
            <a href="{{ url_for('logout') }}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Sair</a>
          </div>
        </li>
        {% endif %}


    </div>
  </div>
</nav>


<script src="../static/js/script.js"></script>
</body>
</html>
