<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-gray-800 mb-1">Pace (km)</label>
        <input type="text" name="pace_km"
               value="{{ form_data.pace_km or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 04:30">
    </div>

    <div>
        <label class="block text-gray-800 mb-1">Pace (milha)</label>
        <input type="text" name="pace_mile"
               value="{{ form_data.pace_mile or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 07:15">
    </div>

    <button type="submit" class="btn-nave font-bold py-3 w-full rounded-lg">
        Converter
    </button>
</form>
