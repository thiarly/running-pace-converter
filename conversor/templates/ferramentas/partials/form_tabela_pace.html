<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-gray-800 mb-1">Pace inicial (MM:SS)</label>
        <input type="text" name="pace_inicio"
               value="{{ form_data.pace_inicio or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 03:30">
    </div>

    <div>
        <label class="block text-gray-800 mb-1">Pace final (MM:SS)</label>
        <input type="text" name="pace_fim"
               value="{{ form_data.pace_fim or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 06:00">
    </div>

    <div>
        <label class="block text-gray-800 mb-1">Intervalo em segundos</label>
        <input type="number" name="intervalo"
               value="{{ form_data.intervalo or 10 }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 10">
    </div>

    <button type="submit" class="btn-nave font-bold py-3 w-full rounded-lg">
        Gerar tabela
    </button>
</form>
