<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="flex gap-2">
        <input type="number" name="hour" placeholder="Hora"
               value="{{ form_data.hour or '' }}"
               class="w-1/3 text-center py-2 border rounded-lg">

        <input type="number" name="minute" placeholder="Min"
               value="{{ form_data.minute or '' }}"
               class="w-1/3 text-center py-2 border rounded-lg">

        <input type="number" name="second" placeholder="Seg"
               value="{{ form_data.second or '' }}"
               class="w-1/3 text-center py-2 border rounded-lg">
    </div>

    <div>
        <input type="text" name="distance"
               value="{{ form_data.distance or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Distância (km)">
    </div>

    <button type="submit" class="btn-nave font-bold py-3 w-full rounded-lg">
        Calcular ritmo
    </button>
</form>
