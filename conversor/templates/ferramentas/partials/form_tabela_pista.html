<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-gray-800 mb-1">Pace alvo (MM:SS)</label>
        <input type="text"
               name="pace"
               value="{{ form_data.pace or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 04:00"
               required>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
            <label class="block text-gray-800 mb-1">Inicial (m)</label>
            <input type="number"
                   name="distancia_inicial"
                   value="{{ form_data.distancia_inicial or 200 }}"
                   class="w-full py-2 px-4 border rounded-lg"
                   required>
        </div>

        <div>
            <label class="block text-gray-800 mb-1">Final (m)</label>
            <input type="number"
                   name="distancia_final"
                   value="{{ form_data.distancia_final or 1000 }}"
                   class="w-full py-2 px-4 border rounded-lg"
                   required>
        </div>

        <div>
            <label class="block text-gray-800 mb-1">Intervalo (m)</label>
            <input type="number"
                   name="intervalo"
                   value="{{ form_data.intervalo or 200 }}"
                   class="w-full py-2 px-4 border rounded-lg"
                   required>
        </div>
    </div>

    <button type="submit" class="btn-nave font-bold py-3 w-full rounded-lg">
        Gerar tabela de pista
    </button>
</form>
