<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-gray-800 mb-1">Quilômetros</label>
        <input type="text" name="km"
               value="{{ form_data.km or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 10">
    </div>

    <div>
        <label class="block text-gray-800 mb-1">Milhas</label>
        <input type="text" name="miles"
               value="{{ form_data.miles or '' }}"
               class="w-full py-2 px-4 border rounded-lg"
               placeholder="Ex: 6.21">
    </div>

    <button type="submit" class="btn-nave font-bold py-3 w-full rounded-lg">
        Converter
    </button>
</form>
