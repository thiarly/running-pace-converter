<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
        <label class="block text-gray-800 mb-1" for="distance">Distância (km)</label>
        <input type="text" id="distance" name="distance"
               class="w-full text-gray-800 py-2 px-4 border border-gray-300 rounded-lg"
               placeholder="Ex: 21.1">
    </div>

    <div>
        <label class="block text-gray-800 mb-1" for="pace">Pace (MM:SS)</label>
        <input type="text" id="pace" name="pace"
               class="w-full text-gray-800 py-2 px-4 border border-gray-300 rounded-lg"
               placeholder="Ex: 04:30">
    </div>

    <button type="submit" class="btn-nave font-bold py-3 px-4 rounded-lg w-full">
        Calcular tempo
    </button>
</form>
