    <title>

    </title>

            <div>

                    </a>

                       class="text-gray-600 hover:text-pink-600" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="https://www.linkedin.com/in/thiarly-cavalcante-b0aa6056/" target="_blank"
                       class="text-gray-600 hover:text-blue-700" aria-label="LinkedIn">

                    </a>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script> document.getElementById('copyrightYear').textContent = new Date().getFullYear();</script>
